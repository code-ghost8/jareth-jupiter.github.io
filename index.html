<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:#060b1a;
  display:flex;justify-content:center;align-items:center;
  padding:22px;position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(circle at 30% 10%, rgba(0,102,255,0.45), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,255,255,0.25), transparent 40%);
}
.grid{
  position:fixed;inset:0;
  background-image: linear-gradient(rgba(0,102,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,102,255,0.08) 1px, transparent 1px);
  background-size: 45px 45px;opacity:0.5;
}
.card{
  position:relative;z-index:10;width:100%;max-width:400px;
  background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
  border:1px solid rgba(0,153,255,0.4);border-radius:28px;
  padding:30px 24px;backdrop-filter:blur(20px);
  box-shadow: 0 0 0 1px rgba(0,153,255,0.2), 0 20px 60px rgba(0,102,255,0.35);
}
.top{display:flex;align-items:center;gap:16px;text-align:left;margin-bottom:26px;}
.avatar{
  width:78px;height:78px;border-radius:20px;flex-shrink:0;
  background:url('avatar.png') center top / cover;
  border:2px solid #0099ff;box-shadow:0 0 18px rgba(0,153,255,0.7);
  transform:rotate(-3deg);
}
.name h1{font-family:'Space Grotesk';font-size:22px;color:white;letter-spacing:-0.5px}
.name p{font-family:'Poppins';font-size:12px;color:#7ab4ff;font-weight:600;margin-top:2px}
.badge{
  display:inline-block;margin-top:8px;background:#0099ff;color:white;
  font-family:'Space Grotesk';font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:0.8px;
}
.btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:16px 18px;margin:12px 0;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;text-decoration:none;color:white;
  font-family:'Poppins';font-weight:600;font-size:15px;transition:0.2s;
}
.btn:hover{background:rgba(0,153,255,0.18);border-color:#0099ff;transform:translateX(4px);}
.footer{margin-top:18px;text-align:center;color:rgba(255,255,255,0.3);font-family:'Space Grotesk';font-size:10px;letter-spacing:1px}
</style>
</head>
